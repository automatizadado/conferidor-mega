<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conferidor Automático Mega</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #e8f5e9; padding: 15px; display: flex; justify-content: center; }
        .card { background: white; padding: 20px; border-radius: 15px; max-width: 450px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 8px solid #204322; }
        h2 { color: #204322; text-align: center; margin-bottom: 15px; margin-top: 5px; }
        .input-group { margin-bottom: 10px; }
        label { display: block; font-size: 0.85em; color: #666; font-weight: bold; margin-bottom: 3px; }
        input { padding: 12px; border: 1px solid #ccc; border-radius: 8px; width: 100%; box-sizing: border-box; font-size: 16px; background: #f9f9f9; }
        .sorteados-container { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-top: 5px; }
        .sorteados-container input { text-align: center; padding: 10px 2px; font-weight: bold; background: #fff; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1em; margin-top: 10px; transition: transform 0.1s; }
        button:active { transform: scale(0.98); }
        .btn-api { background: #007bff; color: white; margin-bottom: 10px; }
        .btn-check { background: #204322; color: white; }
        .btn-whatsapp { background: #25d366; color: white; display: none; margin-top: 15px; }
        .resultado { margin-top: 20px; padding: 15px; background: #f9f9f9; border-radius: 10px; display: none; border: 1px solid #eee; }
        .alerta-vitoria { background: #d4edda; color: #155724; padding: 12px; border-radius: 8px; border: 1px solid #c3e6cb; margin-top: 15px; font-weight: bold; text-align: center; display: none; }
        #status { font-size: 0.85em; text-align: center; color: #666; margin-bottom: 10px; font-weight: 500; }
    </style>
</head>
<body>

<div class="card">
    <h2>🍀 Mega-Sena Auto</h2>
    
    <div id="status">Clique abaixo para buscar o último sorteio</div>
    <button class="btn-api" onclick="buscarUltimoResultado()">🔄 BUSCAR RESULTADO OFICIAL</button>

    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
        <div style="flex: 1;"><label>Concurso</label><input type="number" id="concurso"></div>
        <div style="flex: 1.3;"><label>Data Sorteio</label><input type="text" id="data-sorteio" placeholder="dd/mm/aaaa"></div>
        <div style="flex: 0.9;"><label>Restantes</label><input type="number" id="restantes" value="12" oninput="salvarRestantes(this.value)"></div>
    </div>

    <div class="input-group"><label>Prêmio do Concurso (R$)</label><input type="text" id="premio"></div>

    <label>Números Sorteados</label>
    <div class="sorteados-container">
        <input type="number" id="s1" min="1" max="60"><input type="number" id="s2" min="1" max="60"><input type="number" id="s3" min="1" max="60">
        <input type="number" id="s4" min="1" max="60"><input type="number" id="s5" min="1" max="60"><input type="number" id="s6" min="1" max="60">
    </div>

    <button class="btn-check" style="margin-top: 20px;" onclick="conferir()">CONFERIR MEUS JOGOS</button>
    
    <div id="alerta" class="alerta-vitoria">🎊 TEVE JOGO PREMIADO! 🤑 🎊</div>

    <div id="resultado-box" class="resultado">
        <div id="lista-acertos"></div>
        <button class="btn-whatsapp" id="btn-wa" onclick="copiarWhatsApp()">Copiar para WhatsApp 📱</button>
    </div>
</div>

<script>
// Lista dos seus jogos cadastrados
const meusJogos = [
    [17, 23, 36, 37, 45, 53],
    [05, 10, 27, 37, 40, 58],
    [11, 19, 25, 33, 45, 46],
    [10, 13, 23, 24, 34, 53],
    [01, 06, 14, 17, 24, 57]
];

// Carrega o número de sorteios restantes salvo no navegador ao abrir a página
document.addEventListener('DOMContentLoaded', () => {
    const salvosRestantes = localStorage.getItem('mega_restantes');
    if (salvosRestantes !== null) {
        document.getElementById('restantes').value = salvosRestantes;
    }
});

// Salva o valor de sorteios restantes dinamicamente
function salvarRestantes(valor) {
    localStorage.setItem('mega_restantes', valor);
}

// Captura as dezenas digitadas ou buscadas nos inputs de sorteio
function getSorteados() {
    return [
        parseInt(document.getElementById('s1').value), parseInt(document.getElementById('s2').value),
        parseInt(document.getElementById('s3').value), parseInt(document.getElementById('s4').value),
        parseInt(document.getElementById('s5').value), parseInt(document.getElementById('s6').value)
    ].filter(n => !isNaN(n));
}

// Busca o resultado na API
async function buscarUltimoResultado() {
    const status = document.getElementById('status');
    status.innerText = "Buscando concurso mais recente...";
    status.style.color = "#666";
    
    try {
        // 1. Busca o concurso mais recente (N)
        const response = await fetch('https://loteriascaixa-api.herokuapp.com/api/megasena/latest');
        const data = await response.json();
        
        const currentConcurso = data.concurso;
        document.getElementById('concurso').value = currentConcurso;
        
        // CORREÇÃO SEGURA: Só preenche se o elemento existir na tela
        const inputDataSorteio = document.getElementById('data-sorteio');
        if (inputDataSorteio) {
            inputDataSorteio.value = data.data || "";
        }
        
        // Renderiza as dezenas sorteadas nos inputs
        const dezenas = data.dezenas;
        for (let i = 1; i <= 6; i++) {
            document.getElementById('s' + i).value = parseInt(dezenas[i-1]);
        }
        
        status.innerText = `Concurso ${currentConcurso} carregado! Buscando prêmio acumulado...`;
        
        // 2. Busca o concurso anterior (N-1) para descobrir o prêmio estimado para o concurso atual
        let valorPremioReal = null;
        try {
            const prevResponse = await fetch(`https://loteriascaixa-api.herokuapp.com/api/megasena/${currentConcurso - 1}`);
            if (prevResponse.ok) {
                const prevData = await prevResponse.json();
                valorPremioReal = prevData.valorEstimadoProximoConcurso;
            }
        } catch (prevError) {
            console.warn("Não foi possível acessar o concurso anterior para validar o prêmio real:", prevError);
        }
        
        // 3. Aplica o valor encontrado ou usa o fallback do próprio concurso caso a segunda requisição falhe
        if (valorPremioReal) {
            document.getElementById('premio').value = valorPremioReal.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
            status.innerText = `Resultado e prêmio real do concurso ${currentConcurso} carregados com sucesso!`;
            status.style.color = "green";
        } else {
            // Fallback: Se falhar a busca do N-1, exibe o estimado cadastrado no próprio JSON do concurso atual
            const fallbackPremio = data.valorEstimadoProximoConcurso || data.valorAcumuladoProximoConcurso || 0;
            document.getElementById('premio').value = fallbackPremio.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
            status.innerText = `Resultado carregado (Prêmio obtido via estimativa de contingência).`;
            status.style.color = "orange";
        }
        
    } catch (error) {
        status.innerText = "Erro ao buscar dados. Digite os números manualmente.";
        status.style.color = "red";
    }
}

// Realiza a conferência exibindo o resultado na tela
function conferir() {
    const sorteados = getSorteados();

    if (sorteados.length < 6) { 
        alert("Busque o resultado ou preencha as 6 dezenas para conferir!"); 
        return; 
    }

    let html = "";
    let ganhou = false;

    meusJogos.forEach((jogo, i) => {
        let acertos = 0;
        
        // Renderiza as dezenas destacando em verde as acertadas
        const jogoHtml = jogo.map(n => {
            const dezenaFormatada = n.toString().padStart(2, '0');
            if (sorteados.includes(n)) {
                acertos++;
                return `<span style="background: #2ebd59; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin: 0 2px;">${dezenaFormatada}</span>`;
            }
            return `<span style="margin: 0 2px; color: #444;">${dezenaFormatada}</span>`;
        }).join(' ');

        if (acertos >= 4) ganhou = true;

        // Identifica faixas de premiação
        let faixa = "";
        if (acertos === 4) faixa = " (🏅 QUADRA!)";
        else if (acertos === 5) faixa = " (🔥 QUINA!!)";
        else if (acertos === 6) faixa = " (👑 SENA!!!)";

        html += `
            <div style="margin-bottom: 12px; font-size: 0.95em; border-bottom: 1px dashed #ddd; padding-bottom: 8px;">
                <b>Jogo ${i + 1}:</b> ${jogoHtml} <br>
                <span style="font-size: 0.85em; color: ${acertos >= 4 ? '#155724' : '#666'}; font-weight: ${acertos >= 4 ? 'bold' : 'normal'}">
                    🎯 ${acertos} acertos${faixa}
                </span>
            </div>
        `;
    });

    document.getElementById('lista-acertos').innerHTML = html;
    document.getElementById('resultado-box').style.display = 'block';
    document.getElementById('btn-wa').style.display = 'block';
    document.getElementById('alerta').style.display = ganhou ? 'block' : 'none';
}

// Copia o resumo com formatação limpa para a área de transferência
function copiarWhatsApp() {
    const conc = document.getElementById('concurso').value || "---";
    const prem = document.getElementById('premio').value || "---";
    const rest = document.getElementById('restantes').value || "---";
    const sorteados = getSorteados();

    if (sorteados.length < 6) {
        alert("Não há resultado completo para copiar!");
        return;
    }

    const sorteadosStr = sorteados.map(n => n.toString().padStart(2, '0')).join(' ');

    // CORREÇÃO SEGURA: Captura a data da tela apenas se o campo existir e estiver preenchido
    const inputDataSorteio = document.getElementById('data-sorteio');
    const dataTexto = inputDataSorteio && inputDataSorteio.value ? ` (${inputDataSorteio.value})` : "";

    let texto = `🍀 *RESUMO MEGA-SENA*\n🔢 *Concurso:* ${conc}${dataTexto}\n💰 *Prêmio:* R$ ${prem}\n✨ *Resultado:* ${sorteadosStr}\n--------------------------\n`;
    
    let ganhou = false;
    meusJogos.forEach((jogo, i) => {
        const acertos = jogo.filter(n => sorteados.includes(n)).length;
        if (acertos >= 4) ganhou = true;
        
        let faixa = "";
        if (acertos === 4) faixa = " (🏅 QUADRA!)";
        else if (acertos === 5) faixa = " (🔥 QUINA!!)";
        else if (acertos === 6) faixa = " (👑 SENA!!!)";

        // Destaca no WhatsApp apenas as dezenas que foram acertadas
        const jogoFormatadoWpp = jogo.map(n => {
            const dezenaFormatada = n.toString().padStart(2, '0');
            if (sorteados.includes(n)) {
                return `*${dezenaFormatada}*`; // Envolve em asteriscos para virar negrito no WhatsApp
            }
            return dezenaFormatada;
        }).join('-');

        texto += `✅ Jogo ${i + 1}: ${jogoFormatadoWpp} -> *${acertos} acertos*${faixa}\n`;
    });

    texto += `--------------------------\n`;
    if (ganhou) {
        texto += `🎊 *TEVE JOGO PREMIADO!* 🤑\n--------------------------\n`;
    }
    texto += `⏳ *Sorteios restantes:* ${rest}`;

    navigator.clipboard.writeText(texto).then(() => {
        alert("Resumo de conferência copiado para o WhatsApp!");
    }).catch(err => {
        alert("Erro ao copiar automaticamente. Tente selecionar o texto manual.");
    });
}
</script>
</body>
</html>
